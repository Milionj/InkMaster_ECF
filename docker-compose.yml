version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=inkmaster
      - JWT_SECRET=inkmasterSecret
      - RECAPTCHA_SECRET=taCleRecaptcha
    depends_on:
      - db
    volumes:
      - ./backend:/app
    restart: always

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inkmaster
    ports:
       - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=root
    restart: always

  frontend:
    build: ./front
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
