services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env           # le backend lit les variables ici (DB_HOST=db, DB_PORT=3306, etc.)
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --skip-host-cache
      --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inkmaster_db
    ports:
      - "3307:3306"              # Accès MySQL depuis ta machine: localhost:3307
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=root
    restart: always

  frontend:
    build: ./front
    ports:
      - "5173:80"                # site servi par Nginx sur 80 dans le conteneur
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
  