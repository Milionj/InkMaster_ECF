services:
  backend:
    build: ./backend              # Construit l'image à partir du dossier backend/
    ports:
      - "5000:5000"               # Rend l'API accessible sur http://localhost:5000
    environment:
      - DB_HOST=db               # Adresse du service MySQL (correspond au nom du conteneur "db")
      - DB_USER=root             # Nom d'utilisateur MySQL
      - DB_PASSWORD=root         # Mot de passe MySQL
      - DB_NAME=inkmaster_db     # Nom de la base de données utilisée
      - JWT_SECRET=inkmasterSecret          # Clé secrète pour les tokens JWT
      - RECAPTCHA_SECRET=...                # Clé secrète pour reCAPTCHA côté backend
    depends_on:
      db:
        condition: service_healthy          # Ne démarre ce service que quand la base est prête
    restart: always                         # Redémarre automatiquement en cas de crash

  db:
    image: mysql:8.0                        # Utilise l'image officielle MySQL version 8
    environment:
      MYSQL_ROOT_PASSWORD: root            # Mot de passe pour le compte root
      MYSQL_DATABASE: inkmaster_db         # Crée automatiquement cette base au démarrage
    ports:
      - "3307:3306"                         # Accès à MySQL en local via le port 3307
    volumes:
      - db_data:/var/lib/mysql             # Stocke les données MySQL sur le disque (persistant)
    restart: always
    healthcheck:                            # Vérifie que MySQL est prêt à répondre avant de démarrer d'autres services
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin           # Image officielle de phpMyAdmin
    ports:
      - "8080:80"                           # Accessible depuis le navigateur sur http://localhost:8080
    environment:
      - PMA_HOST=db                        # Connexion directe à la base de données "db"
      - MYSQL_ROOT_PASSWORD=root
    restart: always

  frontend:
    build: ./front                         # Construit l'image depuis le dossier front/
    ports:
      - "5173:80"                           # Le site sera visible sur http://localhost:5173
    depends_on:
      - backend                            # Attend que le backend soit prêt
    restart: always

volumes:
  db_data:     # Volume nommé pour sauvegarder les données MySQL entre les démarrages
